name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Tampilkan error
        if: failure()
        run: grep -nE "^e: |error:|What went wrong|FAILURE" -A4 build.log | head -80
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: HonqBoost-debug
          path: app/build/outputs/apk/debug/*.apk
